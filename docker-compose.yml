services:
  postgres:
    profiles: ["infra"]
    image: postgres:16-alpine
    container_name: agentboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentboard
      POSTGRES_PASSWORD: agentboard
      POSTGRES_DB: agentboard
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentboard -d agentboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["infra"]
    image: redis:7-alpine
    container_name: agentboard-redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  orchestrator:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    container_name: agentboard-orchestrator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agentboard:agentboard@postgres:5432/agentboard
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ORCHESTRATOR_PORT: 3001
      WORKSPACE_ROOT: /workspace
    volumes:
      - workspace:/workspace
    ports:
      - "3001:3001"

  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: agentboard-web
    restart: unless-stopped
    depends_on:
      - orchestrator
    ports:
      - "5173:80"

  # Preview/launch_preview service — task 553eea82.
  # Self-contained demo build (VITE_DEMO=true seeds activity) so QA + Uma
  # can open /dashboard without booting the orchestrator + postgres stack.
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_DEMO: "true"
        VITE_API_URL: ""
        VITE_WS_URL: ""
    ports:
      - "0:80"

volumes:
  pgdata:
  redisdata:
  workspace:
